apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nessie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nessie
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nessie
    spec:
      containers:
        - name: nessie
          image: {{ .Values.nessie.image }}
          env:
            - name: CATALOG_WAREHOUSE
              value: s3://datalake/
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://{{ .Release.Name }}-minio:9000
            - name: CATALOG_S3_ACCESS__KEY__ID
              value: minioadmin
            - name: CATALOG_S3_SECRET__ACCESS__KEY
              value: minioadmin
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: AWS_REGION
              value: us-east-1
          ports:
            - containerPort: 8181
          readinessProbe:
            tcpSocket:
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nessie
spec:
  selector:
    app: {{ .Release.Name }}-nessie
  ports:
    - port: 8181
      targetPort: 8181
