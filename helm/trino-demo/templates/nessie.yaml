apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nessie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nessie
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nessie
    spec:
      containers:
        - name: nessie
          image: {{ .Values.nessie.image }}
          env:
            - name: QUARKUS_PROFILE
              value: prod
            - name: NESSIE_VERSION_STORE_TYPE
              value: {{ .Values.nessie.storage }}
          ports:
            - containerPort: 19120
          readinessProbe:
            httpGet:
              path: /api/v2/config
              port: 19120
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nessie
spec:
  selector:
    app: {{ .Release.Name }}-nessie
  ports:
    - port: 19120
      targetPort: 19120
