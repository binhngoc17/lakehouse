trino:
  coordinator:
    resources:
      requests:
        memory: 2Gi
        cpu: "1"
  additionalConfigFiles:
    iceberg.properties: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://trino-demo-nessie:8181
      fs.native-s3.enabled=true
      s3.endpoint=http://trino-demo-minio:9000
      s3.path-style-access=true
      s3.aws-access-key=minioadmin
      s3.aws-secret-key=minioadmin
      s3.region=us-east-1

minio:
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  defaultBuckets: "datalake"
  persistence:
    enabled: false

nessie:
  image: tabulario/iceberg-rest:latest

seed:
  image: "" # set to your built seed image: registry/trino-demo-seed:latest
  numCustomers: "1000"
  numAccounts: "1500"
  numTransactions: "50000"

pipelineRunner:
  image: "" # set to your built pipeline-runner image
  schedule: "0 2 * * *"

ui:
  image: nginx:1.27-alpine
  port: 3000
